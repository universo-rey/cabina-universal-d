table:
  logical_name: sdu_agent
  display_name: SDU Agent
  ownership: user_or_team
  change_tracking: true
  auditing: true
  primary_name: sdu_name
columns:
  - name: sdu_name
    type: text
    required: true
  - name: sdu_canonical_id
    type: text
    required: true
    alternate_key: true
  - name: sdu_owner
    type: text
  - name: sdu_reviewer
    type: text
  - name: sdu_scope
    type: multiline_text
  - name: sdu_status
    type: choice
    values: [active, gated, blocked, deprecated]
policy:
  no_remote_persistent_agent_creation: true
