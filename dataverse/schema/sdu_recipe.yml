table:
  logical_name: sdu_recipe
  display_name: SDU Recipe
  ownership: user_or_team
  change_tracking: true
  auditing: true
  primary_name: sdu_name
columns:
  - name: sdu_name
    type: text
    required: true
  - name: sdu_canonical_id
    type: text
    required: true
    alternate_key: true
  - name: sdu_source_path
    type: text
  - name: sdu_allowed_surfaces
    type: multiline_text
  - name: sdu_blocked_surfaces
    type: multiline_text
  - name: sdu_status
    type: choice
    values: [active, gated, blocked, deprecated]
policy:
  no_live_execution_without_gate: true
