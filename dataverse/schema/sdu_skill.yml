table:
  logical_name: sdu_skill
  display_name: SDU Skill
  ownership: user_or_team
  change_tracking: true
  auditing: true
  primary_name: sdu_name
columns:
  - name: sdu_name
    type: text
    required: true
  - name: sdu_canonical_id
    type: text
    required: true
    alternate_key: true
  - name: sdu_source_path
    type: text
  - name: sdu_trigger_boundary
    type: multiline_text
  - name: sdu_validator
    type: text
  - name: sdu_status
    type: choice
    values: [active, gated, blocked, deprecated]
policy:
  repo_local_skill_source_preferred: true
