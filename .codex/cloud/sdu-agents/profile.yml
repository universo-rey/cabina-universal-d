profile_id: sdu-agents-runtime-connections-dev
repo: universo-rey/cabina-universal-d
base_ref: main
mode: repo_scoped_governed
live_writes: governed_gated
production: governed_gated
remote_persistent_agent: false
allowed_actions:
  - read_repo
  - codex_cloud_status
  - codex_cloud_diff
  - codex_cloud_exec
  - run_local_validators
  - propose_patch
  - prepare_readback
  - codex_cloud_apply
blocked_actions:
  - microsoft_live
  - openai_api_live
  - production
  - permission_change
  - material_sensitive_storage
required_evidence:
  - validator_output
  - git_diff_check
  - readback
stop_conditions:
  - CODEX_CLOUD_LIVE_WRITE_ATTEMPTED
  - SECRET_DETECTED
  - PRODUCTION_MUTATION_ATTEMPTED
