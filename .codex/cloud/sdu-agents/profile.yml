profile_id: sdu-agents-runtime-connections-dev
repo: universo-rey/cabina-universal-d
base_ref: main
mode: repo_scoped_governed
live_writes: risk_tiered
production: governed_gated
remote_persistent_agent: false
allowed_actions:
  - read_repo
  - codex_cloud_status
  - codex_cloud_diff
  - codex_cloud_exec
  - run_local_validators
  - propose_patch
  - prepare_readback
  - codex_cloud_apply
blocked_actions:
  - unresolved_target_execution
  - high_effect_without_authority
  - material_sensitive_storage
required_evidence_for_repo_changes:
  - validator_output
  - git_diff_check
  - readback
stop_conditions:
  - UNRESOLVED_TARGET_EXECUTION
  - SECRET_DETECTED
  - HIGH_EFFECT_WITHOUT_AUTHORITY
