# THIS IS AUTOGENERATED BY CABINA GOVERNANCE. UPDATE THROUGH PR.
version = 1
name = "cabina-universal-d"

[setup]
script = '''
set -eu
echo "Cabina Universal D uses the Windows setup script for governed local/worktree validation."
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
if ($env:CODEX_WORKTREE_PATH) {
  Set-Location $env:CODEX_WORKTREE_PATH
}

pwsh -NoProfile -File ".agents/codex/tools/local_validate_agents_instruction_hierarchy.ps1"
pwsh -NoProfile -File ".agents/codex/tools/local_validate_capability_use_hardening.ps1"
pwsh -NoProfile -File ".agents/codex/tools/local_validate_autonomous_agent_execution.ps1"
pwsh -NoProfile -File ".agents/codex/tools/local_validate_codex_cloud_governed_lane.ps1"
pwsh -NoProfile -File ".agents/codex/tools/local_validate_codex_app_environments.ps1"
pwsh -NoProfile -File ".agents/codex/tools/local_run_repo_alignment_runtime.ps1" -NoWrite
git diff --check
'''

[cleanup]
script = '''
set +e
rm -rf .pytest_cache
find . -type d -name "__pycache__" -prune -exec rm -rf {} +
'''

[cleanup.win32]
script = '''
$ErrorActionPreference = "Continue"
if ($env:CODEX_WORKTREE_PATH) {
  Set-Location $env:CODEX_WORKTREE_PATH
}

Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ".pytest_cache"
Get-ChildItem -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
'''

[[actions]]
name = "Validar Cabina"
icon = "test"
command = "pwsh -NoProfile -File .agents/codex/tools/local_validate_capability_use_hardening.ps1"
platform = "win32"

[[actions]]
name = "Validar Entornos Codex"
icon = "test"
command = "pwsh -NoProfile -File .agents/codex/tools/local_validate_codex_app_environments.ps1"
platform = "win32"

[[actions]]
name = "Revisar Codex Cloud"
icon = "test"
command = "pwsh -NoProfile -File .agents/codex/tools/local_validate_codex_cloud_governed_lane.ps1"
platform = "win32"

[[actions]]
name = "Validar Agentes Autonomos"
icon = "test"
command = "pwsh -NoProfile -File .agents/codex/tools/local_validate_autonomous_agent_execution.ps1"
platform = "win32"

[[actions]]
name = "Runtime Solo Lectura"
icon = "debug"
command = "pwsh -NoProfile -File .agents/codex/tools/local_run_repo_alignment_runtime.ps1 -NoWrite"
platform = "win32"

[[actions]]
name = "Validar Capa de Agentes"
icon = "test"
command = "pwsh -NoProfile -File .agents/codex/tools/local_validate_agent_layer.ps1"
platform = "win32"

[[actions]]
name = "Revisar Diff Git"
icon = "tool"
command = "git diff --check"
platform = "win32"

[[actions]]
name = "Ver Estado Git"
icon = "tool"
command = "git status --short --branch"
platform = "win32"
