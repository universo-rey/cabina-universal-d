name: Governed Agent Task
description: Route a GitHub issue to a declared Cabina Universal agent.
title: "[agent] "
labels: ["agent-task", "governed"]
body:
  - type: dropdown
    id: agent_id
    attributes:
      label: Agent
      description: Declared owner agent responsible for this task.
      options:
        - rey.control_plane_orchestrator
        - rey.frontier_guardian
        - rey.governance_registrar
        - rey.authority_canonist
        - rey.repo_cartographer
        - rey.migration_planner
        - court.openai_dispatcher
        - court.seshat_evidence
        - court.sdu_gate
        - court.thot_schema
        - tech.reference_librarian
        - codex.workspace_guardian
        - universe.escribania_tower
        - universe.modo_on_tower
    validations:
      required: true
  - type: input
    id: lead_agent
    attributes:
      label: Lead agent
      description: Agent coordinating the lane and integration.
      placeholder: "rey.control_plane_orchestrator"
    validations:
      required: true
  - type: input
    id: base_sha
    attributes:
      label: Base SHA
      description: Current base commit used to declare this lane.
      placeholder: "40-char commit sha"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Branch that will carry this work. Must use codex/*.
      placeholder: "codex/issue-slug"
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface
      description: Repo, folder, PR, issue, matrix or external system.
      placeholder: "D:/... or universo-rey/cabina-universal-d#..."
    validations:
      required: true
  - type: input
    id: lane
    attributes:
      label: Lane and lock key
      description: Parallel lane id plus lock_key. Use SERIAL if scope overlaps.
      placeholder: "parallel_disjoint_workers / lock.file_set.declared"
    validations:
      required: true
  - type: input
    id: max_parallel
    attributes:
      label: Max parallel
      description: Maximum parallel executions allowed for this declared lane.
      placeholder: "1"
    validations:
      required: true
  - type: textarea
    id: declared_file_set
    attributes:
      label: Declared file set
      description: Exact files the agent may write. Shared indexes require a separate serial integration lane.
      placeholder: "D:/path/file1.md\nD:/path/file2.csv"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Read and write scope
      description: Declare read_scope, write_scope, dependency and max_parallel.
      placeholder: "read_scope: ...\nwrite_scope: ...\ndependency: ...\nmax_parallel: ..."
    validations:
      required: true
  - type: input
    id: reviewer_agent
    attributes:
      label: Reviewer agent
      description: Agent that reviews the owner output. Must differ from owner for live, API, production or permission work.
      placeholder: "court.seshat_evidence"
    validations:
      required: true
  - type: dropdown
    id: universe
    attributes:
      label: Universe
      options:
        - ROOT_CONTROL_PLANE
        - COURT
        - ESCRIBANIA
        - MODO_ON
        - TECH_REFERENCE
        - NO_CONSTA
    validations:
      required: true
  - type: textarea
    id: order
    attributes:
      label: Governed order
      description: What should the agent do?
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: Pre-repo automation preflight
      description: Evidence that GitHub templates, order packets, Agents SDK local boundary and validators were checked before repo iteration.
      placeholder: "local_validate_github_automation_preflight.ps1 PASS; Agents SDK local only; no API live; repo iteration starts after preflight"
    validations:
      required: true
  - type: textarea
    id: operational_chain
    attributes:
      label: Operational chain
      description: Declare agent, skill, recipe, plugin, tool, surface, validator, evidence and stop_condition before execution.
      placeholder: "agent: ...\nskill: ...\nrecipe: ...\nplugin: ...\ntool: ...\nsurface: ...\nvalidator: ...\nevidence: ...\nstop_condition: ..."
    validations:
      required: true
  - type: textarea
    id: capability_use_preflight
    attributes:
      label: Capability-use preflight
      description: Evidence that assignment and derivation resolved against capability-use hardening before execution.
      placeholder: "local_validate_capability_use_hardening.ps1 PASS; CAPABILITY_USE_HARDENING_MATRIX row: capability_use...."
    validations:
      required: true
  - type: textarea
    id: autonomous_agent_execution
    attributes:
      label: Autonomous agent execution
      description: Declare autonomous mode, Codex Cloud environment status, owner/reviewer, rollback, postcheck and validator.
      placeholder: "mode: local_task_scoped|github_task_scoped|codex_cloud_task_scoped\nenvironment: ACTIVE_CODEX_CLOUD_READY|BLOCKED_NO_CODEX_CLOUD_ENVIRONMENT\nvalidator: local_validate_autonomous_agent_execution.ps1 PASS\nrollback: ...\npostcheck: ..."
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: No Microsoft live
          required: true
        - label: No OpenAI API live
          required: true
        - label: No production
          required: true
        - label: No secrets or regulated data
          required: true
        - label: No moving clones
          required: true
        - label: Capability-use preflight is declared before execution
          required: true
        - label: No merge without approved lifecycle, fixed HEAD and green checks
          required: true
  - type: textarea
    id: validation
    attributes:
      label: Validator and evidence
      description: Required checks and expected evidence.
      placeholder: "local_validate_agent_layer.ps1 PASS; local_validate_skill_reference_sources.ps1 or local_validate_frontend_design_lane.ps1 when applicable; readback; matrix row..."
    validations:
      required: true
  - type: textarea
    id: rollback_postcheck
    attributes:
      label: Rollback and postcheck
      description: Required for writes, PR work, runtime, live/API, production or permissions.
      placeholder: "rollback: ...\npostcheck: ..."
    validations:
      required: true
  - type: textarea
    id: stop_condition
    attributes:
      label: Stop condition
      description: Exact condition that stops the task.
    validations:
      required: true
