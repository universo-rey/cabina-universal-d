name: Runtime Or External Agent Approval
description: Approve a productive runtime or non-GitHub external agent surface.
title: "[approval] runtime/external agent: "
labels: ["runtime-approval", "github-agent-approved"]
body:
  - type: input
    id: agent_id
    attributes:
      label: Preparing agent
      description: Agent preparing this order packet.
      placeholder: "court.openai_dispatcher"
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface
      description: Exact repo, tenant, API, app, connector or agent surface.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Human owner
      description: Person or role accountable for approval and rollback.
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Identity and permissions
      description: Account, app, token class or connector identity. Do not paste secrets.
    validations:
      required: true
  - type: textarea
    id: data_boundary
    attributes:
      label: Data boundary
      description: What data may be read or written? Mark NO_CONSTA if unclear.
    validations:
      required: true
  - type: textarea
    id: secret_boundary
    attributes:
      label: Secret boundary
      description: Secret source, handling rule and confirmation that no secret is pasted into GitHub, files, logs or prompts.
      placeholder: "OPENAI_API_KEY from local/approved secret store only; never pasted; no repo persistence"
    validations:
      required: true
  - type: textarea
    id: allowed_actions
    attributes:
      label: Allowed actions
      description: Exact actions allowed for this runtime or external agent surface.
      placeholder: "local smoke, selected synthetic eval, draft PR comment..."
    validations:
      required: true
  - type: textarea
    id: blocked_actions
    attributes:
      label: Blocked actions
      description: Exact actions still blocked by this approval.
      placeholder: "production, Microsoft live, broad regulated data, permissions, merge, force push..."
    validations:
      required: true
  - type: textarea
    id: operational_chain
    attributes:
      label: Operational chain
      description: Declare agent, skill, recipe, plugin, tool, surface, validator, evidence and stop_condition before execution.
      placeholder: "agent: ...\nskill: ...\nrecipe: ...\nplugin: ...\ntool: ...\nsurface: ...\nvalidator: ...\nevidence: ...\nstop_condition: ..."
    validations:
      required: true
  - type: textarea
    id: capability_use_preflight
    attributes:
      label: Capability-use preflight
      description: Evidence that plugin, tool, identity, surface and validator assignment resolved before runtime execution.
      placeholder: "local_validate_capability_use_hardening.ps1 PASS; governed order capability chain declared"
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: Exact rollback plan.
    validations:
      required: true
  - type: textarea
    id: evidence_validator
    attributes:
      label: Evidence and validator
      description: Evidence artifact plus local or GitHub validator expected before execution.
      placeholder: "evidence: ...\nvalidator: ..."
    validations:
      required: true
  - type: textarea
    id: postcheck
    attributes:
      label: Postcheck
      description: How the result will be verified after execution.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost and runtime boundary
      description: External costs, Actions minutes, API costs or production impacts.
    validations:
      required: true
  - type: textarea
    id: expiration_rule
    attributes:
      label: Expiration rule
      description: When this approval expires or must be renewed.
      placeholder: "expires when identity, repo, model, data boundary, cost boundary, secret boundary or branch changes"
    validations:
      required: true
  - type: textarea
    id: stop_condition
    attributes:
      label: Stop condition
      description: Exact blocker or halt rule.
    validations:
      required: true
