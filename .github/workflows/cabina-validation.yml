name: Cabina Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "MANIFEST.yaml"
      - "README.md"
      - "REPO_SCOPE.md"
      - "00_CONTROL_PLANE_INGRESS/**"
      - "01_GOVERNANCE_REGISTRY/**"
      - "02_AUTHORITY_CANON/**"
      - ".codex/**"
      - ".agents/skills/**"
      - ".agents/codex/**"
      - ".github/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "AGENTS.md"
      - "MANIFEST.yaml"
      - "README.md"
      - "REPO_SCOPE.md"
      - "00_CONTROL_PLANE_INGRESS/**"
      - "01_GOVERNANCE_REGISTRY/**"
      - "02_AUTHORITY_CANON/**"
      - ".codex/**"
      - ".agents/skills/**"
      - ".agents/codex/**"
      - ".github/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cabina-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local governance validators
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare local-only folders
        shell: pwsh
        run: |
          foreach ($path in @(
            ".agents\codex\orders",
            ".agents\codex\readbacks",
            "80_REFERENCIAS_TECNICAS"
          )) {
            New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE $path) | Out-Null
          }

      - name: Governance validation suite
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".agents\codex"
          $tool = Join-Path $root "tools\local_run_governance_validation_suite.ps1"
          $output = & $tool -Root $root -RepoRoot $env:GITHUB_WORKSPACE -SkipWorkflowNestedValidators
          $output | Write-Output
          $payload = ($output -join "`n") | ConvertFrom-Json
          if ($payload.status -ne "PASS") {
            exit 1
          }
          if ($payload.result_written -ne $false) {
            throw "Governance validation suite must not write results in GitHub Actions"
          }
