name: Cabina Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "MANIFEST.yaml"
      - "README.md"
      - "REPO_SCOPE.md"
      - "00_CONTROL_PLANE_INGRESS/**"
      - "01_GOVERNANCE_REGISTRY/**"
      - "02_AUTHORITY_CANON/**"
      - ".codex/**"
      - ".agents/skills/**"
      - ".agents/codex/**"
      - ".github/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "AGENTS.md"
      - "MANIFEST.yaml"
      - "README.md"
      - "REPO_SCOPE.md"
      - "00_CONTROL_PLANE_INGRESS/**"
      - "01_GOVERNANCE_REGISTRY/**"
      - "02_AUTHORITY_CANON/**"
      - ".codex/**"
      - ".agents/skills/**"
      - ".agents/codex/**"
      - ".github/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cabina-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local governance validators
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare local-only folders
        shell: pwsh
        run: |
          foreach ($path in @(
            ".agents\codex\orders",
            ".agents\codex\readbacks",
            "80_REFERENCIAS_TECNICAS"
          )) {
            New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE $path) | Out-Null
          }

      - name: Change-aware full coverage orchestrator
        id: change-aware-full-coverage
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".agents\codex"
          $tool = Join-Path $root "tools\local_run_change_aware_full_coverage_orchestrator.ps1"
          $rawAuditPath = Join-Path $env:RUNNER_TEMP "change-aware-full-coverage-audit-raw.json"
          $artifactPath = Join-Path $env:RUNNER_TEMP "change-aware-full-coverage-audit.json"

          $baseRef = "origin/main"
          $headRef = "HEAD"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseRef = "${{ github.event.pull_request.base.sha }}"
            $headRef = "${{ github.event.pull_request.head.sha }}"
          } elseif ("${{ github.event.before }}" -and "${{ github.event.before }}" -notmatch "^0+$") {
            $baseRef = "${{ github.event.before }}"
            $headRef = "${{ github.sha }}"
          }

          $output = & $tool -Root $root -RepoRoot $env:GITHUB_WORKSPACE -BaseRef $baseRef -HeadRef $headRef -ExecutePlan -EmitAuditArtifact -AuditPath $rawAuditPath
          $toolExit = $LASTEXITCODE
          $output | Write-Output
          $payload = ($output -join "`n") | ConvertFrom-Json

          $audit = [ordered]@{
            status = $payload.status
            orchestrator_id = $payload.orchestrator_id
            mode = $payload.mode
            base_ref = $payload.base_ref
            head_ref = $payload.head_ref
            manifest_valid = $payload.manifest_valid
            graph_valid = $payload.graph_valid
            all_required_passed = $payload.all_required_passed
            coverage_equivalence = $payload.coverage_equivalence
            no_hidden_flaky = $payload.no_hidden_flaky
            blocked_surfaces_clear = $payload.blocked_surfaces_clear
            required_test_count = $payload.required_test_count
            planned_test_count = $payload.planned_test_count
            executed_required_test_count = $payload.executed_required_test_count
            missing_required_test_count = $payload.missing_required_test_count
            failed_required_tests = @($payload.failed_required_tests)
            impact_unknown = $payload.impact_unknown
            expansion_applied = $payload.expansion_applied
            max_parallel = $payload.max_parallel
            changed_files = @($payload.changed_files)
            started_at = $payload.started_at
            finished_at = $payload.finished_at
            duration_ms = $payload.duration_ms
            result_written = $payload.result_written
            results = @($payload.results | ForEach-Object {
              [ordered]@{
                id = $_.id
                status = $_.status
                exit_code = $_.exit_code
                duration_ms = $_.duration_ms
                warning_count = $_.warning_count
                error_count = $_.error_count
              }
            })
          }
          $audit | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $artifactPath -Encoding UTF8
          "artifact_path=$artifactPath" >> $env:GITHUB_OUTPUT

          if ($toolExit -ne 0 -or $payload.status -ne "PASS") {
            exit 1
          }
          if (
            $payload.all_required_passed -ne $true -or
            $payload.coverage_equivalence -ne $true -or
            $payload.manifest_valid -ne $true -or
            $payload.graph_valid -ne $true -or
            $payload.no_hidden_flaky -ne $true -or
            $payload.blocked_surfaces_clear -ne $true
          ) {
            throw "Change-aware full coverage acceptance flags are not all true"
          }
          if ($payload.result_written -ne $true) {
            throw "Change-aware full coverage audit artifact was not emitted"
          }

      - name: Upload change-aware full coverage audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: change-aware-full-coverage-${{ github.run_id }}
          path: ${{ steps.change-aware-full-coverage.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
