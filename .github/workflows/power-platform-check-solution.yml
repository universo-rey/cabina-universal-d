name: Power Platform Check Solution

on:
  workflow_dispatch:
    inputs:
      environment_url:
        description: "Dataverse DEV/STAGING environment URL"
        required: true
        type: string
      solution_name:
        description: "Solution unique name for traceability"
        required: true
        type: string
      solution_file:
        description: "Path to solution zip"
        required: true
        type: string
      checker_geo:
        description: "Checker geo"
        required: true
        default: "UnitedStates"
        type: string
      allow_high_critical_override:
        description: "Documented override for High/Critical findings"
        required: true
        default: false
        type: boolean
      override_reason:
        description: "Required when override is true"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-solution:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs
        shell: pwsh
        env:
          INPUT_ENVIRONMENT_URL: ${{ inputs.environment_url }}
          INPUT_SOLUTION_FILE: ${{ inputs.solution_file }}
          INPUT_SOLUTION_NAME: ${{ inputs.solution_name }}
          INPUT_ALLOW_OVERRIDE: ${{ inputs.allow_high_critical_override }}
          INPUT_OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          $url = $env:INPUT_ENVIRONMENT_URL
          $solutionFile = $env:INPUT_SOLUTION_FILE
          $override = [System.Convert]::ToBoolean($env:INPUT_ALLOW_OVERRIDE)
          $reason = $env:INPUT_OVERRIDE_REASON
          if ([string]::IsNullOrWhiteSpace($url)) { throw "environment_url is required" }
          if ($env:INPUT_SOLUTION_NAME -notmatch '^[A-Za-z][A-Za-z0-9_]{0,99}$') { throw "solution_name must be a safe Dataverse unique name" }
          if ([string]::IsNullOrWhiteSpace($solutionFile)) { throw "solution_file is required" }
          if ($url -match "(?i)(prod|production|live)") { throw "Target looks like production/live. Provide DEV/STAGING only." }
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $solutionFile = [System.IO.Path]::GetFullPath((Join-Path $workspace $solutionFile))
          if (-not $solutionFile.StartsWith($workspace + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) { throw "solution_file must resolve inside GITHUB_WORKSPACE" }
          if ([System.IO.Path]::GetExtension($solutionFile) -ne '.zip') { throw "solution_file must be a .zip file" }
          if (-not (Test-Path -LiteralPath $solutionFile -PathType Leaf)) { throw "solution_file not found: $solutionFile" }
          if ($override -and [string]::IsNullOrWhiteSpace($reason)) { throw "override_reason is required when override is true" }

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Who am I
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ inputs.environment_url }}
          app-id: ${{ secrets['POWERPLATFORM_APP_ID'] }}
          client-secret: ${{ secrets['POWERPLATFORM_CLIENT_SECRET'] }}
          tenant-id: ${{ secrets['POWERPLATFORM_TENANT_ID'] }}

      - name: Check solution
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          environment-url: ${{ inputs.environment_url }}
          app-id: ${{ secrets['POWERPLATFORM_APP_ID'] }}
          client-secret: ${{ secrets['POWERPLATFORM_CLIENT_SECRET'] }}
          tenant-id: ${{ secrets['POWERPLATFORM_TENANT_ID'] }}
          path: ${{ inputs.solution_file }}
          geo: ${{ inputs.checker_geo }}
          checker-logs-artifact-name: PowerPlatformCheckerLogs
          fail-on-analysis-error: true

      - name: Document checker gate
        shell: pwsh
        env:
          INPUT_SOLUTION_NAME: ${{ inputs.solution_name }}
          INPUT_CHECKER_GEO: ${{ inputs.checker_geo }}
          INPUT_ALLOW_OVERRIDE: ${{ inputs.allow_high_critical_override }}
          INPUT_OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          "Solution: $env:INPUT_SOLUTION_NAME" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Checker geo: $env:INPUT_CHECKER_GEO" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "High/Critical override: $env:INPUT_ALLOW_OVERRIDE" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:INPUT_ALLOW_OVERRIDE -eq 'true') {
            "Override reason: $env:INPUT_OVERRIDE_REASON" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
