name: Dataverse Import DEV Manual

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to explicit DEV target after protected precheck"
        required: true
        type: boolean
        default: false
      solution_zip:
        description: "Path to solution zip artifact inside workspace"
        required: false
        type: string

permissions:
  contents: read

jobs:
  import-dev:
    runs-on: windows-latest
    environment: dataverse-dev
    env:
      DATAVERSE_DEV_ENVIRONMENT_URL: ${{ vars.DATAVERSE_DEV_ENVIRONMENT_URL }}
      DATAVERSE_DEV_ENVIRONMENT_ID: ${{ vars.DATAVERSE_DEV_ENVIRONMENT_ID }}
      DATAVERSE_TENANT_ID: ${{ vars.DATAVERSE_TENANT_ID }}
      PAC_CLI_AUTH_PROFILE: ${{ vars.PAC_CLI_AUTH_PROFILE }}
      POWERPLATFORM_PUBLISHER_UNIQUE_NAME: ${{ vars.POWERPLATFORM_PUBLISHER_UNIQUE_NAME }}
      DATAVERSE_SOLUTION_UNIQUE_NAME: ${{ vars.DATAVERSE_SOLUTION_UNIQUE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        shell: pwsh
        run: ./dataverse/scripts/validate_dataverse_manifest.ps1
      - name: Precheck DEV target
        shell: pwsh
        run: ./dataverse/scripts/precheck_dataverse_environment.ps1 -RequireDevReady
      - name: Import solution to DEV
        if: ${{ inputs.apply == true }}
        shell: pwsh
        run: ./dataverse/scripts/import_solution_dev.ps1 -Apply -SolutionZip '${{ inputs.solution_zip }}'
      - name: Dry-run import when apply is false
        if: ${{ inputs.apply != true }}
        shell: pwsh
        run: ./dataverse/scripts/import_solution_dev.ps1
      - name: Upload import evidence
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-dev-import-evidence
          path: dataverse/validation/*.json
